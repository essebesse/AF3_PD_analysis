# SLURM settings for the "SLURM Cluster" tab of step 2 (Analyze).
# Copy to slurm_config.toml and edit for your cluster. Every key is optional;
# an empty string leaves that #SBATCH option out (cluster default is used).
# The tab is only shown when `sbatch` is on PATH.

partition = ""          # e.g. "cpu"
qos = ""                # e.g. "normal"
account = ""            # e.g. "my_lab"
time = "23:59:59"

# The predictions are split into this many chunks, submitted as one job array.
default_jobs = 4
# At most this many array tasks run at the same time (sbatch --array=...%N).
# Keep it low on shared storage: the analysis reads many files.
max_concurrent = 2

cpus_options = [8, 16, 32, 64]
default_cpus = 16
memory_options = ["16G", "32G", "64G", "128G"]
default_memory = "32G"

# Shell line that activates the app's Python environment on the compute node.
# Default: the app's own .venv. Examples:
# env_setup = "module load python/3.11 && source /path/to/venv/bin/activate"
# env_setup = "source ~/miniconda3/etc/profile.d/conda.sh && conda activate af3app"

# Extra lines placed right after the #SBATCH header.
# extra_lines = ["#SBATCH --constraint=avx2"]
